name: Nozomi
description: 'Nozomi Networks is an operational technology (OT), IoT and cyber-physical
  systems security company providing asset visibility, vulnerability management and
  threat detection for industrial and critical infrastructure environments. Its platform
  pairs the Vantage cloud console and the on-premises Central Management Console (CMC)
  with the Guardian, Guardian Air (wireless) and Arc (endpoint) sensors, plus Threat
  Intelligence and Asset Intelligence modules, monitoring OT/IoT/IT devices across
  thousands of deployments in energy, manufacturing, healthcare, transportation, water,
  mining, maritime, retail and government sectors. A Vantage REST API and an N2OS /
  Universal SDK support programmatic integration; the full API reference is delivered
  inside the authenticated Vantage tenant and technical documentation portal rather
  than as a public OpenAPI description.'
